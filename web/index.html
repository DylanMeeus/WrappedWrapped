<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WrappedWrapped - Artist Histogram</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="eyebrow">WrappedWrapped</p>
        <h1>Artist frequency across your Top Songs</h1>
        <p class="subtitle">
          Each bar counts how many tracks by an artist appear in your yearly playlists.
        </p>
      </header>
      <section class="card">
        <div id="chart" class="chart">Loading chart…</div>
        <p class="note">Showing top 50 artists by default.</p>
      </section>
    </main>
  </body>
</html>
